[package]
name = "retrovert-ui-bridge"
version.workspace = true
repository.workspace = true
edition = "2021"
license = "MIT"
publish = false
description = "C ABI over retrovert-present for the Quickshell shim; the one place unsafe is allowed"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
cpal = "0.15"
env_logger = "0.11"
log = "0.4"
retrovert-host.workspace = true
retrovert-player.workspace = true
retrovert-present = { path = "../../crates/present" }

[build-dependencies]
cbindgen = "0.29"

# Not `workspace = true`: this crate exists to hold the FFI edge, so unsafe is permitted here
# and nowhere else. Everything behind it stays under the workspace's forbid.
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
