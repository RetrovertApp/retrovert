[package]
name = "retrovert-gui"
version.workspace = true
repository.workspace = true
edition = "2021"
license = "MIT"
publish = false
description = "The retrovert-gui launcher: resolves the shell, probes the renderer and execs qs"

[[bin]]
name = "retrovert-gui"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["env"] }

# Not `workspace = true`: vulkan.rs reaches the loader through dlopen, which needs unsafe.
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
undocumented_unsafe_blocks = "deny"
