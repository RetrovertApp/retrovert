# Harness self-CI: proves the machinery, not any plugin. Runs the full
# build/check/smoke pipeline twice per target against a pinned playback-spu
# revision from two different build paths and requires byte-identical
# artifacts — the determinism guarantee the artifact contract leans on.
name: Harness CI

on:
  push:
    branches: [main]
    paths:
      - harness/**
      - .github/workflows/harness-ci.yml
  pull_request:
    paths:
      - harness/**
      - .github/workflows/harness-ci.yml
  workflow_dispatch: {}

env:
  # Known-good plugin revision the harness validates itself against.
  SPU_TEST_REV: 828e70da1d4631d19c7624a10cf8f7b3de8dbb65

jobs:
  script-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 harness/scripts/selftest.py

  abi-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned retrovert_api revision
        id: pin
        run: |
          REV=$(sed -n 's|^Canonical source: RetrovertApp/retrovert_api @ ||p' harness/abi/PINNED.md)
          if [ -z "$REV" ]; then
            echo "::error::harness/abi/PINNED.md names no canonical revision"
            exit 1
          fi
          echo "rev=$REV" >> "$GITHUB_OUTPUT"

      - name: Check out retrovert_api at that revision
        uses: actions/checkout@v4
        with:
          repository: RetrovertApp/retrovert_api
          ref: ${{ steps.pin.outputs.rev }}
          path: api

      - name: Diff the vendored headers against it
        run: diff -r harness/abi/retrovert api/include/retrovert

      - name: Check the digests describe the vendored copies
        run: cd harness/abi && sha256sum -c HEADERS.sha256

  determinism-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    # Two full pipelines per job, so twice build-plugin.yml's 30-minute cap.
    timeout-minutes: 60
    container:
      image: ghcr.io/retrovertapp/retrovert-build-harness/toolchain-linux@sha256:e986ffdcca86524248bd58cb955bb88a84c603a5cbb35125c3437feb1c0c1dd2
      options: --privileged
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the monorepo
        uses: actions/checkout@v4
        with:
          path: monorepo

      - name: Check out playback-spu at the pinned test revision
        uses: actions/checkout@v4
        with:
          repository: RetrovertApp/playback-spu
          ref: ${{ env.SPU_TEST_REV }}
          path: plugin

      - name: Build twice from different paths
        run: |
          python3.11 monorepo/harness/scripts/harness_build.py \
            --repo plugin --harness monorepo/harness --target ${{ matrix.target }} \
            --work /rvwork-first --out out-a --sandbox jail
          python3.11 monorepo/harness/scripts/harness_build.py \
            --repo plugin --harness monorepo/harness --target ${{ matrix.target }} \
            --work /rvwork-second-longer-path --out out-b --sandbox jail

      - name: Byte-compare
        run: |
          A=$(cut -d' ' -f1 out-a/*.sha256)
          B=$(cut -d' ' -f1 out-b/*.sha256)
          echo "first:  $A"
          echo "second: $B"
          test "$A" = "$B"

  determinism-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out the monorepo
        uses: actions/checkout@v4
        with:
          path: monorepo

      - name: Check out playback-spu at the pinned test revision
        uses: actions/checkout@v4
        with:
          repository: RetrovertApp/playback-spu
          ref: ${{ env.SPU_TEST_REV }}
          path: plugin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Must be the same toolchain build-plugin.yml ships with, or this job
      # proves determinism for a compiler no artifact is built by. Retried for
      # the same reason it is there: chocolatey is a single unmirrored source.
      - name: Install pinned toolchain
        shell: bash
        run: |
          retry() {
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 5 ]; then
                echo "::error::giving up after $attempt attempts: $*"
                return 1
              fi
              echo "attempt $attempt failed, retrying in $(( attempt * 15 ))s: $*"
              sleep $(( attempt * 15 ))
              attempt=$(( attempt + 1 ))
            done
          }
          retry choco install -y --no-progress --allow-downgrade llvm --version=19.1.7
          retry choco install -y --no-progress --allow-downgrade ninja --version=1.12.1
          retry python -m pip install zstandard==0.23.0 pefile==2024.8.26

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build twice from different paths
        shell: bash
        run: |
          export PATH="/c/Program Files/LLVM/bin:$PATH"
          python monorepo/harness/scripts/harness_build.py \
            --repo plugin --harness monorepo/harness --target windows-x86_64 \
            --work "$RUNNER_TEMP/rvwork-first" --out out-a --sandbox none
          python monorepo/harness/scripts/harness_build.py \
            --repo plugin --harness monorepo/harness --target windows-x86_64 \
            --work "$RUNNER_TEMP/rvwork-second-longer-path" --out out-b --sandbox none

      - name: Byte-compare
        shell: bash
        run: |
          A=$(cut -d' ' -f1 out-a/*.sha256)
          B=$(cut -d' ' -f1 out-b/*.sha256)
          echo "first:  $A"
          echo "second: $B"
          test "$A" = "$B"
