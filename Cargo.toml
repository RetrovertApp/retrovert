[workspace]
resolver = "3"
members = [
    "crates/catalog",
    "crates/desktop",
    "crates/library",
    "crates/player",
    "crates/present",
    "crates/playlist",
    "crates/publish",
    "crates/tuf",
    "crates/updater",
    "ui-quickshell/bridge",
    "ui-quickshell/launcher",
]

[workspace.package]
version = "0.1.0"
repository = "https://github.com/RetrovertApp/retrovert"

[workspace.dependencies]
retrovert-host = { git = "https://github.com/RetrovertApp/retrovert_api.git", rev = "36e0f66fa61e83d0532e1cce1c34b37c9a111a5b" }
retrovert-library = { path = "crates/library" }
retrovert-player = { path = "crates/player" }
retrovert-tuf = { path = "crates/tuf", version = "0.1.0" }
retrovert-updater = { path = "crates/updater" }

clap = { version = "4.6", features = ["derive"] }
ed25519-dalek = { version = "3.0", features = ["pem", "pkcs8", "zeroize"] }
getrandom = "0.3"
hex = "0.4"
jiff = { version = "0.2", features = ["serde"] }
olpc-cjson = "0.1"
pollster = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sigstore-tuf = { version = "0.11", default-features = false }
tempfile = "3"
thiserror = "2.0"
ureq = { version = "3", default-features = false, features = ["rustls"] }
zeroize = "1.8"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# Every fallible function here fails for the reason its signature implies; a
# boilerplate `# Errors` section per function would be noise, not documentation.
missing_errors_doc = "allow"

[profile.release]
debug = true
