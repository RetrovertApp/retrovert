[workspace]
resolver = "2"
members = [
    "crates/retrovert-player",
    "crates/retrovert-player-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
flowi = { path = "../flowi/rust/flowi" }
log = "0.4"
retrovert-host = { path = "../retrovert/retrovert_api/rust/retrovert-host" }
retrovert-player = { path = "crates/retrovert-player" }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
debug = true
