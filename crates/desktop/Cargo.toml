[package]
name = "retrovert-player-desktop"
version.workspace = true
repository.workspace = true
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "retrovert"
path = "src/main.rs"

[dependencies]
cpal = "0.15"
env_logger = "0.11"
log = "0.4"
retrovert-host.workspace = true
retrovert-player.workspace = true
retrovert-plugin-catalog = { path = "../catalog" }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
