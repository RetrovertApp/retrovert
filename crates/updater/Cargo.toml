[package]
name = "retrovert-updater"
description = "Resolves a signed update channel into a verified installed generation of content-agnostic artifacts"
version.workspace = true
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository.workspace = true

[dependencies]
hex.workspace = true
jiff.workspace = true
pollster.workspace = true
retrovert-tuf.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sigstore-tuf.workspace = true
tempfile.workspace = true
thiserror.workspace = true
ureq.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# Every fallible function here fails for the reason its signature implies; a
# boilerplate `# Errors` section per function would be noise, not documentation.
missing_errors_doc = "allow"
