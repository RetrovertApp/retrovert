[package]
name = "retrovert-plugin-catalog"
version.workspace = true
repository.workspace = true
edition = "2021"
license = "MIT"
publish = false

[dependencies]
log = "0.4"
retrovert-player.workspace = true
retrovert-updater.workspace = true
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
zstd = "0.13"

[dev-dependencies]
retrovert-host.workspace = true
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
