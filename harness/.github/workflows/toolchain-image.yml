# Builds the pinned Linux toolchain image natively per arch and stitches a
# multi-arch manifest. The resulting digest is hardcoded into
# build-plugin.yml; changing the image is therefore a harness version bump.
name: Toolchain image

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - docker/**
      - .github/workflows/toolchain-image.yml

env:
  IMAGE: ghcr.io/retrovertapp/retrovert-build-harness/toolchain-linux

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push per-arch image
        run: |
          docker build \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            -f docker/Dockerfile.linux \
            -t "$IMAGE:${{ github.sha }}-${{ matrix.arch }}" \
            docker
          docker push "$IMAGE:${{ github.sha }}-${{ matrix.arch }}"

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            "$IMAGE:${{ github.sha }}-amd64" \
            "$IMAGE:${{ github.sha }}-arm64"

      - name: Print pinnable digest
        run: |
          echo "Pin this digest in .github/workflows/build-plugin.yml:"
          docker buildx imagetools inspect "$IMAGE:${{ github.sha }}" | head -5
